[project]
name = "worthflow"
version = "0.1.0"
description = "Local-first personal savings and finance dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openpyxl>=3.1",
    "typer>=0.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "truststore>=0.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-openpyxl",
]

[project.scripts]
finance = "cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "FURB", "DTZ"]
ignore = [
    "B008",    # FastAPI's Depends(...) in default args is the idiomatic pattern
    "DTZ011",  # date.today() is intentional: snapshot dates are local calendar dates
    "DTZ005",  # datetime.now() without tz is intentional for local timestamps/filenames
]
